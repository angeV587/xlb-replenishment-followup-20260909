function panelTable(id,title,hs,data){const names={'已补商品数（含跟进）':'已补商品数','已补商品占比':'已补商品数占比','跟进拒绝占比':'跟进拒绝商品数占比','占全部拒绝比例':'拒绝占比','商品分类':'商品条件','加入黑名单次数':'黑名单次数','涉及门店数（去重）':'涉及门店数','涉及商品数（去重）':'涉及商品数'};hs=hs.map(h=>names[h]||h);if(id==='blackStats'){hs=hs.slice(0,4);data=data.map(r=>r.slice(0,4))}exports[id]=[hs,data];const display=data.map(row=>row.map((c,i)=>typeof c==='string'&&c.endsWith('%')?`<span class="bar"><i style="width:${parseFloat(c)}%;background:${hs[i].includes('黑名单')?'#ed6b68':hs[i].includes('拒绝')?'#ec9b21':'#68c342'}"></i></span>${c}`:esc(c)));let heads=hs.map(h=>h==='已补商品数'?`${h}<br><small class="muted">含跟进已补商品数</small>`:h);return `<section class="panel"><div style="display:flex;justify-content:space-between"><h2>${title}</h2><button onclick="exportRows('${id}')">导出</button></div>${table(id,heads,display,true)}</section>`}
function dashboard(){let a=filterRows(),t=tasks.filter(t=>a.some(r=>r.task===t.id)),f=a.filter(r=>r.f),fs=t.filter(t=>f.some(r=>r.task===t.id));const filled=a.filter(r=>r.s==='已补货').length,ff=f.filter(r=>r.f==='已补货').length,ref=f.filter(r=>r.f==='已拒绝').length;let cards=[['补货门店数',uniq(a.map(r=>r.code)),'门店去重'],['推荐商品数',a.length,'按推荐明细次数'],['推荐已补商品数',filled,pct(filled,a.length)],['跟进门店数',uniq(f.map(r=>r.code)),'门店去重'],['跟进商品数',f.length,'按跟进明细次数'],['跟进已补商品数',ff,pct(ff,f.length)],['跟进拒绝商品数',ref,pct(ref,f.length)]];let html=`<div class="panel">${filterUI()}${note('③ 组织在前、门店多选；效期勾选项增加解释。所有统计共用同一查询范围。')}</div><div class="grid">${cards.map(c=>`<div class="kpi">${c[0]}<b>${c[1]}</b><small>${c[2]}</small></div>`).join('')}</div>`;let sd=[...new Set(a.map(r=>r.code))].map(code=>{let b=a.filter(r=>r.code===code),f=b.filter(r=>r.f),n=b.filter(r=>r.s==='已补货'||r.f==='已补货').length,j=f.filter(r=>r.f==='已拒绝').length,bl=f.filter(r=>r.black).length;return[b[0].store,b.length,n,pct(n,b.length),f.length,j,pct(j,f.length),bl,pct(bl,f.length)]});html+=note('④ 门店汇总新增“跟进商品总数”；已补商品数包含两个阶段，跟进拒绝与黑名单占比以跟进商品总数为分母。');html+=panelTable('storeStats','补货任务明细',['门店名称','推荐商品数量','已补商品数（含跟进）','已补商品占比','跟进商品总数','跟进拒绝商品数','跟进拒绝占比','黑名单商品数','黑名单商品占比'],sd);let fd=[...new Set(fs.map(t=>t.person))].map(person=>{let ts=fs.filter(t=>t.person===person),b=f.filter(r=>ts.includes(taskOf(r))),done=b.filter(r=>['已补货','已拒绝'].includes(r.f)).length,ab=ts.filter(t=>t.phase==='closed'&&!fComplete(t)).length,n=b.filter(r=>r.f==='已补货').length,j=b.filter(r=>r.f==='已拒绝').length,bl=b.filter(r=>r.black).length,u=b.filter(r=>r.f==='已超时').length;return[person,pct(done,b.length),ts.length,ab,pct(ab,ts.length),b.length,n,pct(n,b.length),j,pct(j,b.length),bl,pct(bl,b.length),u,pct(u,b.length)]});html+=note('⑤ 异常关闭＝截止时仍未完成的跟进任务。到期后仍展示已完成的任务，不计异常。');let hs=['跟进人','跟进完成比例','任务数','异常关闭任务数','异常关闭任务占比','跟进商品数','跟进已补商品数','跟进已补占比','跟进拒绝商品数','跟进拒绝占比','黑名单商品数','黑名单占比','未处理商品数','未处理占比'];exports.followStats=[hs,fd];html+=`<section class="panel"><div class="toolbar"><h2>跟进任务明细</h2><button onclick="exportRows('followStats')">导出</button></div>${table('followStats',hs.map(h=>h==='异常关闭任务数'?h+tip('跟进任务结束时，仍有待跟进或待补货商品，最终已超时且未完成的任务数。按跟进任务编码去重；已经完成后自然到期的任务不计入。'):h),fd.map(r=>r.map(esc)),true)}</section>`;let rd=[...new Set(f.filter(r=>r.f==='已拒绝').map(r=>r.reason))].map(reason=>{let b=f.filter(r=>r.f==='已拒绝'&&r.reason===reason);return[reason,b.length,pct(b.length,ref),uniq(b.map(r=>r.code)),uniq(b.map(r=>r.g[0]))]});html+=panelTable('reasonStats','拒绝原因分析',['拒绝原因','拒绝次数','占全部拒绝比例','涉及门店数（去重）','涉及商品数（去重）'],rd);let bd=[...new Set(f.filter(r=>r.black).map(r=>r.g[0]))].map(id=>{let b=f.filter(r=>r.black&&r.g[0]===id);return[b[0].g[1],id,b[0].g[4],b.length,uniq(b.map(r=>r.code))]});html+=panelTable('blackStats','黑名单商品明细',['商品名称','商品代码','商品分类','加入黑名单次数','涉及门店数（去重）'],bd);return html}
function records(){let a=filterRows().filter(r=>(!rfilter.task||r.task.includes(rfilter.task))&&(!rfilter.follow||taskOf(r).fid.includes(rfilter.follow))&&(!rfilter.status||r.s===rfilter.status)&&(!rfilter.fs||r.f===rfilter.fs));let hs=['补货任务编码','推送时间','补货结束时间','跟进任务编码','跟进开始时间','跟进结束时间','发货门店','补货门店','商品代码','商品名称','补货状态','跟进人','跟进状态','补货数量','关联订单','拒绝原因','是否黑名单','截止日期'];let data=a.map(r=>{let t=taskOf(r);return[r.task,t.start,t.end,r.f?t.fid:'—',r.f?t.fs:'—',r.f?t.fe:'—','示例配送中心',r.store,r.g[0],r.g[1],r.s,r.f?t.person:'—',r.f||'—',r.n,r.order||'—',r.reason||'—',r.black?'是':'否',r.black?(r.date||'永久'):'—']});exports.records=[hs,data];return `<div class="panel"><div class="toolbar"><button onclick="readRecordFilters()">查询</button><button onclick="exportRows('records')">导出</button></div>${filterUI()}<div class="filter"><label>补货任务编码 <input id="rt" placeholder="包含式模糊搜索" value="${esc(rfilter.task||'')}"></label><label>跟进任务编码 <input id="rf" placeholder="包含式模糊搜索" value="${esc(rfilter.follow||'')}"></label><label>补货状态 <select id="rs">${['','待补货','已补货','已删除','已超时'].map(s=>`<option ${rfilter.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>跟进状态 <select id="rfs">${['','待跟进','待补货','已补货','已拒绝','已超时'].map(s=>`<option ${rfilter.fs===s?'selected':''}>${s}</option>`).join('')}</select></label></div>${note('① 模块更名“补货推荐记录”，第一阶段状态改为“已删除”；仅未处理商品产生跟进编号。横向滚动查看两个阶段及订单关联。')}${table('records',hs,data)}</div>`}
function readRecordFilters(){rfilter={task:document.querySelector('#rt').value.trim(),follow:document.querySelector('#rf').value.trim(),status:document.querySelector('#rs').value,fs:document.querySelector('#rfs').value};pages={};render()}
function pool(){return `<div class="panel"><div class="toolbar"><button onclick="toast('已查询演示配置')">查询</button><button onclick="poolEdit()">新建商品池</button><button onclick="go('reasons')">拒绝原因</button><button onclick="go('push')">推送配置</button></div><div class="filter"><label>配置名称 <input id="poolSearch"></label><label>配置状态 <select><option>全部</option><option>已启用</option><option>已停用</option></select></label></div>${table('pool',['配置名称','商品池','普通门店','配送中心门店','配置状态','最后更新人','最后更新时间','操作'],[[`<button onclick="poolEdit()">重点商品补货</button>`,'必卖/主推/手动/6','3','0',`<button onclick="poolEnabled=!poolEnabled;render()">${poolEnabled?'已启用':'已停用'}</button>`,'演示运营','2026-09-09 09:00',`<button onclick="poolEdit()">编辑</button>`]],true)}${note('保留原店品范围与命中规则；推送配置由统一入口维护，第一期采用统一规则。')}</div>`}
function poolEdit(){modal('补货商品池 · 门店商品配置',`<div class="field"><span>配置名称 *</span><input value="重点商品补货"></div><h3>门店范围</h3><div class="field"><span>配送中心门店</span><select><option>请选择配送中心</option><option>示例配送中心</option></select></div><div class="field"><span>普通门店 *</span><button onclick="toast('演示范围：中心路、花园路、星河路3家门店')">已选3家门店</button></div><h3>商品范围——命中规则</h3><p><label><input type="checkbox" checked>近 <input type="number" value="28" min="1" max="300" style="width:60px"> 天无仓到店调入</label></p><p><label><input type="checkbox" checked>近 <input type="number" value="28" min="1" max="300" style="width:60px"> 天门店无动销</label></p><p><label><input type="checkbox" checked>商品实际发货仓可用库存 &gt; 0</label></p><p><label><input type="checkbox" checked>商品在门店的在途和在订 = 0</label></p><h3>商品范围——标签与自选商品</h3><p><label><input type="checkbox" checked>必卖品</label>　<label><input type="checkbox">主推品</label>　<button onclick="toast('演示已添加6个商品')">添加商品</button></p><p class="hint">候选商品取并集去重，再过滤有效店品黑名单。</p>`,'<button class="primary" onclick="closeModal();toast(\'配置已保存，仅本页演示\')">保存</button>')}
function pushPage(){return `<div class="panel"><h2>推送配置</h2><div class="sheet"><section><h3>补货任务</h3><div class="field"><span>推送周期</span><select><option>每周</option></select></div><div class="field"><span>推送星期</span><select id="pd">${['星期一','星期二','星期三','星期四','星期五','星期六','星期日'].map(d=>`<option ${push.day===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><span>推送时间</span><input id="pt" type="time" value="${push.time}"></div><div class="field"><span>失效时间</span>推送日 + <input id="pn" type="number" min="0" value="${push.days}" style="width:65px">天 <input id="pe" type="time" value="${push.end}" style="width:100px"></div></section><section><h3>跟进任务</h3><div class="field"><span>推送时间</span>补货失效后 + <input id="pf" type="number" min="0" value="${push.delay}" style="width:65px">分钟</div><div class="field"><span>失效时间</span>跟进推送日 + <input id="pfn" type="number" min="0" value="${push.fdays}" style="width:65px">天 <input id="pfe" type="time" value="${push.fend}" style="width:100px"></div><p class="hint">只向未完成操作的商品生成跟进任务。可配置0分钟衔接。</p></section></div><p class="note">示例：周四09:00推送，+4天周一09:00结束；30分钟后跟进，+2天周三18:00结束。开始/结束时间由订货系统提供给任务中心。</p>${note('配置对后续新任务生效；当前原型仅演示每周，跨周期重叠处理是评审建议：同店同品有效任务未结束时不重复生成。')}<button class="primary" onclick="savePush()">保存配置</button></div>`}
function savePush(){const n=Number(document.querySelector('#pn').value),f=Number(document.querySelector('#pf').value),fn=Number(document.querySelector('#pfn').value),time=document.querySelector('#pt').value,end=document.querySelector('#pe').value,fend=document.querySelector('#pfe').value;if(![n,f,fn].every(x=>Number.isInteger(x)&&x>=0)||!time||!end||!fend||(n===0&&end<=time)){toast('请填写有效时间，失效时间必须晚于推送时间');return}push={day:document.querySelector('#pd').value,time,days:n,end,delay:f,fdays:fn,fend};toast('推送配置已保存，仅对后续新任务生效')}
function reasonsPage(){return `<div class="panel"><div class="toolbar"><h2>拒绝原因配置</h2><button onclick="modal('新增拒绝原因','<div class=field>拒绝原因 * <input id=newReason maxlength=50></div><div class=field>补充说明 <input maxlength=100></div>','<button class=primary onclick=addReason()>确认</button>')">新建原因</button></div>${table('reasons',['拒绝原因','状态','操作'],reasons.map((r,i)=>[esc(r.name),`<button onclick="reasons[${i}].enabled=!reasons[${i}].enabled;render()">${r.enabled?'已启用':'已停用'}</button>`,`<button ${r.enabled?'disabled':''} onclick="reasons.splice(${i},1);render()">删除</button>`]),true)}${note('原因供督导拒绝补货选择；门店删除不再要求填写原因。')}</div>`}
function addReason(){let name=document.querySelector('#newReason').value.trim();if(!name||reasons.some(r=>r.name===name)){toast('请输入不重复的拒绝原因');return}reasons.push({name,enabled:false});closeModal();render()}
function blacklistPage(){let a=rows.filter(r=>r.black&&!r.blackRemoved);let hs=['组织','门店名称','门店代码','商品名称','商品代码','截止日期','来源跟进任务','操作人'];let d=a.map(r=>[r.org,r.store,r.code,r.g[1],r.g[0],r.date||'永久',taskOf(r).fid,taskOf(r).person]);exports.blacklist=[hs,d];return `<div class="panel"><div class="toolbar"><button onclick="toast('显示全部演示黑名单')">查询</button><button onclick="exportRows('blacklist')">导出</button></div>${note('第一期由督导拒绝处理产生黑名单，隐藏“新增”和“导入”。到期仅恢复后续推荐资格，不改写已结束任务。')}${table('blacklist',hs.concat('操作'),d.map((r,i)=>r.map(esc).concat(`<button onclick="modal('移除黑名单','移除后，该店品可参与后续推荐；历史跟进拒绝结果保留。','<button class=primary onclick=removeBlack(${a[i].id})>确认移除</button>')">删除</button>`)),true)}</div>`}
function removeBlack(id){rows.find(r=>r.id===id).blackRemoved=true;closeModal();render();toast('已解除后续推荐屏蔽，历史加入统计保留')}
function parameter(){return `<div class="panel"><div class="toolbar"><button class="primary" onclick="restrict=document.querySelector('#restrict').checked;toast('参数已保存')">保存</button></div><div class="seg"><button class="active">订货配置</button><button disabled>退货配置</button><button disabled>配送配置</button></div><p><label><input type="checkbox" checked disabled>APP商品无可用库存不允许补货</label></p><p><label><input type="checkbox" checked disabled>门店补货单显示中心可用库存</label></p><p><label><input type="checkbox" id="restrict" ${restrict?'checked':''}>推荐商品未处理完成，APP门店订单禁止审核</label>${tip('当前门店的有效补货任务仍有待补货商品时，审核提示先处理。全部已补货或已删除后可继续审核。')}</p>${note('第一期复用配送参数作用范围，不增设按单店/发货仓的个性化配置。')}</div>`}
function storePage(){let t=tasks[0],a=taskRows(t).filter(r=>r.s==='待补货');if(order)return orderPage();if(t.phase!=='store')return `<div class="phone"><div class="ptop">门店补货</div><p class="banner">当前补货任务已超期，无法继续处理。</p></div>`;return `<div class="mobile-wrap"><div class="phone"><div class="ptop">门店选品 <span class="hint">${t.store}</span></div><div class="banner">您有${a.length}个待补货商品需确认，请及时完成下单！</div><div class="cats"><button class="sel">全部</button><button disabled>水饮</button><button disabled>零食</button></div><div class="products">${a.map(r=>{qty[r.id]??=1;return `<div class="product"><input aria-label="选择${r.g[1]}" type="checkbox" ${selected.has(r.id)?'checked':''} onchange="this.checked?selected.add(${r.id}):selected.delete(${r.id});render()"><div class="pic">${r.g[2]}</div><div class="body"><h4>${r.g[1]}</h4><small>规格：标准配送规格<br>库存 12　中心库存 200</small><div class="price">¥${r.g[3].toFixed(2)} / 件</div><div class="qty"><button aria-label="减少${r.g[1]}" onclick="qty[${r.id}]=Math.max(1,qty[${r.id}]-1);render()">−</button><input aria-label="${r.g[1]}数量" type="number" min="1" value="${qty[r.id]}" onchange="qty[${r.id}]=Math.max(1,Math.floor(Number(this.value)||1));render()"><button aria-label="增加${r.g[1]}" onclick="qty[${r.id}]++;render()">+</button></div></div></div>`}).join('')||'<p>本批商品已处理完成。</p>'}</div><div class="bottom"><label><input type="checkbox" ${a.length&&a.every(r=>selected.has(r.id))?'checked':''} onchange="selected=this.checked?new Set(taskRows(tasks[0]).filter(r=>r.s==='待补货').map(r=>r.id)):new Set();render()">全选</label><span class="price">¥${a.filter(r=>selected.has(r.id)).reduce((s,r)=>s+qty[r.id]*r.g[3],0).toFixed(2)}</span><button ${!a.some(r=>selected.has(r.id))?'disabled':''} onclick="deleteStore()">批量删除</button><button class="primary" ${!a.some(r=>selected.has(r.id))?'disabled':''} onclick="makeOrder()">生成订单</button></div><nav><span>分类</span><span class="selected">缺品补单</span><span>采购车</span><span>订单</span></nav></div><section><h2>门店补货操作</h2>${note('② 所有待补货商品初始数量为1；勾选后按数量生成订单。')}<p class="note">选择部分商品生成订单，可演示保存成功、跳转订单详情、审核拦截、返回处理剩余商品。</p><p>已处理：${storeDone(t)} / ${taskRows(t).length}</p><div class="toolbar"><button onclick="expireStore()">演示补货期结束</button><button onclick="jumpTask('store')">演示IM去补货</button></div><p class="hint">IM为外部入口演示；本页不建设任务中心配置或发送真实通知。</p></section></div>`}
function deleteStore(){modal('删除商品',`确定删除已选中的${selected.size}个商品吗？删除后记为“已删除”，无需填写原因。`,'<button class="primary" onclick="rows.filter(r=>selected.has(r.id)&&r.s===\'待补货\').forEach(r=>r.s=\'已删除\');selected.clear();closeModal();render()">确认删除</button>')}
function makeOrder(){let a=taskRows(tasks[0]).filter(r=>selected.has(r.id)&&r.s==='待补货');if(!a.length)return;order={id:'DD-DEMO-'+Date.now().toString().slice(-6),rows:a.map(r=>r.id),status:'制单'};a.forEach(r=>{r.s='已补货';r.n=qty[r.id];r.order=order.id});selected.clear();render();toast('保存成功')}
function orderPage(){let a=rows.filter(r=>order.rows.includes(r.id));return `<div class="mobile-wrap"><div class="phone"><div class="ptop">门店订单详情</div><div class="card"><div class="title">${order.id}${tag(order.status)}</div><p>仓配订单 · 示例中心路店</p></div><div class="products">${a.map(r=>`<div class="product"><div class="pic">${r.g[2]}</div><div><h4>${r.g[1]}</h4><p>${r.n} 件　¥${(r.n*r.g[3]).toFixed(2)}</p></div></div>`).join('')}</div><div class="bottom"><button onclick="order=null;render()">返回处理</button><button class="primary" ${order.status==='审核'?'disabled':''} onclick="auditOrder()">审核</button></div></div><section><h2>生成后跳转订单详情</h2>${note('保存成功提示；存在未处理推荐商品时，审核弹窗提供“取消”和“去处理”。')}<p class="note">制单计入补货及外部单据变化监控的精确定义，详见评审稿的联调决策项。</p></section></div>`}
function auditOrder(){if(restrict&&tasks[0].phase==='store'&&taskRows(tasks[0]).some(r=>r.s==='待补货'))modal('请先处理推荐商品','当前门店还有未处理的推荐商品，请完成补货或删除后再审核。','<button class="primary" onclick="closeModal();order=null;render()">去处理</button>');else{order.status='审核';render();toast('审核成功（演示）')}}
function expireStore(){let t=tasks[0];taskRows(t).filter(r=>r.s==='待补货').forEach(r=>{r.s='已超时';r.f='待跟进'});t.phase='follow';if(followRows(t).length)t.fid='F20260909001';followId=t.fid;toast('已演示推进到跟进阶段，尚未处理商品生成跟进编号');go('follow')}
let followDetail=false;function followPage(){let ts=tasks.filter(t=>t.fid&&(tabStage==='live'?t.phase==='follow':t.phase==='closed'));let t=tasks.find(t=>t.fid===followId)||ts[0];if(!followDetail)return `<div class="mobile-wrap"><div class="phone"><div class="ptop">补货跟进</div><div class="cats"><button class="${tabStage==='live'?'sel':''}" onclick="tabStage='live';render()">生效中</button><button class="${tabStage==='past'?'sel':''}" onclick="tabStage='past';render()">已超期</button></div><div style="padding:12px"><input placeholder="搜索任务编号或门店" style="width:100%" oninput="document.querySelectorAll('[data-search]').forEach(e=>e.hidden=!e.dataset.search.includes(this.value))"></div>${ts.map(t=>`<div class="card" role="button" tabindex="0" data-search="${t.fid} ${t.store}" onclick="followId='${t.fid}';followDetail=true;render()"><div class="title"><b>${t.fid}</b>${tag(fComplete(t)?'已完成':'未完成')}</div><div>${t.store}</div><div>跟进人：${t.person}　进度 ${fDone(t)} / ${followRows(t).length}</div><small>开始：${t.fs}<br>结束：${t.fe}</small></div>`).join('')||'<p class="card">暂无任务</p>'}</div><section><h2>督导跟进任务</h2><p>生效状态与完成状态分开展示；到期前已完成的任务，在“已超期”中仍显示已完成。</p><p class="note">完成分子仅包含已补货和已拒绝，已超时不计完成。</p></section></div>`;if(!t)return '';let a=followRows(t),closed=t.phase==='closed';return `<div class="mobile-wrap"><div class="phone"><div class="ptop"><button onclick="followDetail=false;render()">‹</button>补货跟进详情</div><div class="card"><b>${t.fid}</b><div class="row"><span>${t.store}</span>${tag(fComplete(t)?'已完成':'未完成')}</div><div class="row">${t.person}<span>进度 ${fDone(t)} / ${a.length}</span></div><small>${t.fs} 至 ${t.fe}</small></div><div class="products">${a.map(r=>`<div class="product"><div class="pic">${r.g[2]}</div><div class="body"><h4>${r.g[1]}</h4><small>商品代码：${r.g[0]}</small><p>${tag(r.f)}</p>${r.reason?`<small>拒绝原因：${esc(r.reason)}<br>黑名单：${r.black?(r.date||'永久'):'否'}</small>`:''}<div style="display:flex;gap:5px">${!closed&&['待跟进','待补货'].includes(r.f)?`<button ${r.f==='待补货'?'disabled':''} onclick="rows.find(r=>r.id===${r.id}).f='待补货';render()">标记待补货</button><button onclick="reject(${r.id})">拒绝补货</button>`:!closed&&r.f==='已拒绝'?`<button onclick="undoReject(${r.id})">取消拒绝</button>`:''}</div></div></div>`).join('')}</div></div><section><h2>跟进处理与自动更新</h2>${note('“已补货”由订单/调入依据自动判定，督导不可手动选择；已到期任务只读。')}<p class="note">下方是原型演示控件，正式业务页不提供“模拟”按钮。</p><div class="toolbar"><button ${closed?'disabled':''} onclick="simulatePurchase()">模拟门店下单</button><button ${closed?'disabled':''} onclick="endFollow()">模拟跟进期结束</button></div><p>黑名单和看板会随本页处理结果同步变化。</p><p class="hint">取消拒绝与黑名单撤销规则为评审建议，待确认后定稿。</p></section></div>`}
function reject(id){modal('拒绝补货',`<div class="field"><span>拒绝原因 *</span><select id="reasonChoice"><option value="">请选择</option>${reasons.filter(r=>r.enabled).map(r=>`<option>${esc(r.name)}</option>`).join('')}</select></div><p><label><input type="checkbox" id="blackChoice" onchange="document.querySelector('#dateWrap').hidden=!this.checked">加入推荐黑名单</label></p><div id="dateWrap" hidden><div class="field"><span>截止日期</span><input id="blackDate" type="date" min="2026-09-09"></div><small>不填日期表示永久屏蔽。</small></div>`,`<button class="primary" onclick="saveReject(${id})">确认</button>`)}function saveReject(id){let reason=document.querySelector('#reasonChoice').value,date=document.querySelector('#blackDate').value,black=document.querySelector('#blackChoice').checked;if(!reason){toast('请选择拒绝原因');return}if(black&&date&&date<'2026-09-09'){toast('截止日期不能早于当前日期');return}let r=rows.find(r=>r.id===id);r.f='已拒绝';r.reason=reason;r.black=black;r.date=black?date:'';closeModal();render();toast('跟进结果已保存')}
function undoReject(id){modal('取消拒绝','恢复为待跟进，并撤销本次操作产生的黑名单。该规则为评审建议。',`<button class="primary" onclick="let r=rows.find(r=>r.id===${id});r.f='待跟进';r.reason='';r.black=false;r.date='';closeModal();render()">确认</button>`)}function simulatePurchase(){let t=tasks.find(t=>t.fid===followId),r=followRows(t).find(r=>['待跟进','待补货'].includes(r.f));if(!r){toast('没有可模拟补货的待处理商品');return}r.f='已补货';r.n=1;r.order='DD-DEMO-AUTO-'+r.id;render();toast('门店有效下单，自动更新为已补货')}
function endFollow(){let t=tasks.find(t=>t.fid===followId);followRows(t).filter(r=>['待跟进','待补货'].includes(r.f)).forEach(r=>r.f='已超时');t.phase='closed';tabStage='past';render();toast(fComplete(t)?'已完成任务到期归档':'跟进任务到期，未完成部分异常关闭')}
function jumpTask(){let t=tasks[0];if(t.phase!=='store'){toast('当前任务已超期，无法跳转');return}if(storeDone(t)===taskRows(t).length){toast('当前任务已完成，无法跳转');return}go('store')}
function flow(){return `<div class="panel"><h2>两段式任务与状态</h2><div class="timeline"><article><b>① 门店补货期</b><p>定时生成店品清单<br>门店下单 → 已补货<br>门店删除 → 已删除<br>到期未处理 → 已超时</p></article><article><b>② 督导跟进期</b><p>仅接收第一阶段未处理商品<br>待跟进 → 待补货（人工）<br>有效下单/调入 → 已补货（自动）<br>拒绝＋原因 → 已拒绝（人工）</p></article><article><b>③ 全周期结束</b><p>未处理商品 → 已超时<br>未完成任务 → 异常关闭<br>冻结历史结果<br>下一周期过滤有效黑名单</p></article></div><h3>区分任务是否完成与是否到期</h3>${table('states',['层级','完成分子','分母','到期处理'],[['补货任务','已补货＋已删除','本次推荐商品明细数','未处理转跟进'],['跟进任务','已补货＋已拒绝','本次跟进商品明细数','待跟进/待补货转已超时'],['任务完成标识','分子等于分母','非空任务','已超时不计完成']])}<p class="note">第二阶段补货计入跟进已补，第一阶段结果保留；门店总已补数量按两阶段合计，同一推荐明细只计一次。阶段边界状态、单据撤销与刷新频率详见评审稿。</p></div>`}
function render(){document.querySelector('#menu').innerHTML=NAV.map(([id,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('');document.querySelector('#title').textContent=NAV.find(n=>n[0]===page)?.[1]||'补货追踪看板';document.querySelector('#app').innerHTML=({pool,push:pushPage,reasons:reasonsPage,blacklist:blacklistPage,records,parameter,store:storePage,follow:followPage,dashboard,flow}[page]||dashboard)()}
let category='全部',pushTab='补货任务';
const originalPushPage=pushPage;
pushPage=function(){return originalPushPage().replace('<div class="panel">','<div class="panel" style="max-width:760px;margin:30px auto">').replace('<div class="sheet">',`<div class="seg"><button class="${pushTab==='补货任务'?'active':''}" onclick="pushTab='补货任务';render()">补货任务</button><button class="${pushTab==='跟进任务'?'active':''}" onclick="pushTab='跟进任务';render()">跟进任务</button></div><div class="sheet" style="display:block">`).replace('<section><h3>补货任务</h3>',`<section ${pushTab==='跟进任务'?'hidden':''}><h3>补货任务</h3>`).replace('<section><h3>跟进任务</h3>',`<section ${pushTab==='补货任务'?'hidden':''}><h3>跟进任务</h3>`)};
const originalStorePage=storePage;
storePage=function(){let content=originalStorePage();if(order||tasks[0].phase!=='store')return content;content=content.replace('<button class="sel">全部</button><button disabled>水饮</button><button disabled>零食</button>','<button class="sel">全部</button><button onclick="filterStore(\'水饮\')">定量水饮</button><button onclick="filterStore(\'零食\')">休闲零食</button>');content=content.replace('<div class="products">',`<div class="store-layout"><div class="store-rail">${['全部','水饮','零食','日用品'].map(c=>`<button class="${category===c?'active':''}" onclick="filterStore('${c}')">${c}</button>`).join('')}</div><div class="products">`).replace('<div class="bottom">','</div><div class="bottom">');return content};
function filterStore(c){category=c;render();const all=taskRows(tasks[0]).filter(r=>r.s==='待补货');document.querySelectorAll('.phone .product').forEach((el,i)=>{el.hidden=c!=='全部'&&all[i]?.g[4]!==c})}
const originalRender=render;
render=function(){originalRender();const menu=document.querySelector('#menu');menu.innerHTML=['看板','看板（新）','档案','配送','采购','库存','批发','零售','数据','价格','监控'].map(n=>`<button class="${n==='配送'?'active':''}" onclick="toast('原型仅演示配送业务模块')">${n}</button>`).join('');let picker=document.querySelector('#modulePicker');if(!picker){picker=document.createElement('div');picker.id='modulePicker';picker.className='mini-index';document.body.appendChild(picker)}picker.innerHTML=`原型页面切换<select aria-label="原型页面切换" onchange="go(this.value)">${NAV.map(([id,name])=>`<option value="${id}" ${id===page?'selected':''}>${name}</option>`).join('')}</select><label><input type="checkbox" ${document.querySelector('#notes').checked?'checked':''} onchange="document.querySelector('#notes').checked=this.checked;render()">显示改动标注</label><button onclick="category='全部';followDetail=false;reset()">重置演示</button>`;if(page==='dashboard'){document.querySelector('#title').textContent='配送 > 补货追踪看板';let cards=document.querySelectorAll('.kpi');cards.forEach((card,i)=>{if([0,1,3,4].includes(i))card.querySelector('small').style.visibility='hidden'});document.querySelectorAll('th').forEach(el=>{const map={'已补商品数（含跟进）':'已补商品数','已补商品占比':'已补商品数占比','跟进拒绝占比':'跟进拒绝商品数占比','占全部拒绝比例':'拒绝占比','商品分类':'商品条件','加入黑名单次数':'黑名单次数','涉及门店数（去重）':'涉及门店数','涉及商品数（去重）':'涉及商品数'};const text=el.textContent;if(map[text])el.textContent=map[text];if(text==='已补商品数（含跟进）')el.innerHTML='已补商品数<br><small class="muted">含跟进已补商品数</small>'});}}
reset();
</script><script src="refinement.js?v=20260910-reasons"></script></html>
